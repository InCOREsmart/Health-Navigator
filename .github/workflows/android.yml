name: Android Health Navigator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Normalize Expo dependencies
        run: npx expo install --fix

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Enforce Health Connect minimum Android SDK
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path("android/app/build.gradle")
          text = path.read_text()
          updated, count = re.subn(r"minSdkVersion\s+[^\n]+", "minSdkVersion 26", text, count=1)
          if count == 0:
              raise SystemExit("Could not locate minSdkVersion in android/app/build.gradle")
          path.write_text(updated)
          print("Android minSdkVersion forced to 26")
          PY
          grep -n "minSdkVersion" android/app/build.gradle

      - name: Build Android release bundle
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload Android bundle
        uses: actions/upload-artifact@v4
        with:
          name: health-navigator-android-release
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
